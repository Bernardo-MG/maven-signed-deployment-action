name: 'Maven signed artifact deployment'
description: 'Sign and deploy Maven artifacts'
author: 'Bernardo Mart�nez Garrido'
branding:
  icon: 'archive'
  color: 'green'
inputs:
  username:
    description: 'Username for deploying'
    required: true
  password:
    description: 'Password for deploying'
    required: true
  gpg-private-key:
    description: 'Private key for signing'
    required: true
  gpg-passphrase:
    description: 'Passphrase for signing'
    required: true
  repository:
    description: 'Maven repository (distribution management) for deploying the artifacts'
    default: central
    required: false
  profile:
    description: 'Maven profile for deployment'
    default: deployment-central
    required: false
  jdk:
    description: 'JDK version to use'
    default: '17'
    required: false
  maven-version:
    description: 'Maven version; empty uses the runner default'
    required: false
    default: ''
runs:
    using: 'composite'
    steps:
    - name: Check-out
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK ${{ inputs.jdk }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.jdk }}
        distribution: 'temurin'
        cache: 'maven'
        server-id: ${{ inputs.repository }}
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-passphrase: MAVEN_GPG_PASSPHRASE
        gpg-private-key: ${{ inputs.gpg-private-key }}
    - name: Set up Maven ${{ inputs.maven-version }}
      if: ${{ inputs.maven-version != '' }}
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        [[ "$MAVEN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        curl --fail --silent --show-error --location \
          "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
          --output "$RUNNER_TEMP/maven.tar.gz"
        tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
    - name: Check Maven version
      shell: bash
      run: mvn --version
    - name: Deploy
      run: mvn deploy -B -P ${{ inputs.profile }} -DskipTests
      shell: bash
      env:
        MAVEN_USERNAME: ${{ inputs.username }}
        MAVEN_PASSWORD: ${{ inputs.password }}
        MAVEN_GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        MAVEN_GPG_KEY: ${{ inputs.gpg-private-key }}